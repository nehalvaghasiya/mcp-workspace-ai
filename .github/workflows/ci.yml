name: Quality and package builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MODE: mock
  LLM_PROVIDER: fake
  UV_PYTHON: "3.12"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  LLM_API_KEY: ""

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - run: make setup
      - run: make lint format-check typecheck schema-check
      - run: make test-unit
      - run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-builds-and-unit-evidence
          path: |
            dist/
            apps/web/dist/
            .local/coverage*
            .local/test-results*
          include-hidden-files: true
          retention-days: 7