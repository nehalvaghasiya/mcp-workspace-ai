name: Implementation task
description: Track a dependency-ready change with evidence and a merge gate.
title: "[Task]: "
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies and owner
      description: Identify the requirement, affected subsystem, prerequisites and intended owner.
    validations:
      required: true
  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options: [S, M, L]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable behavior and what remains outside scope.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Tests, documentation and verification evidence
      description: Specify checks to execute and where actual results will be recorded.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact and rollback
      description: Cover ownership, scopes, approvals, private data and safe rollback.
    validations:
      required: true
