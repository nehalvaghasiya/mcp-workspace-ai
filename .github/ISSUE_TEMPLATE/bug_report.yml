name: Bug report
description: Report reproducible incorrect behavior using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Never attach credentials, session cookies or private mailbox/document content."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact commands, prompt, fixture and steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and verification
      description: Include source revision, OS, Python/uv/Node/pnpm versions and sanitized error details.
    validations:
      required: true
