[project]
name = "mcp-workspace-evaluations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp-workspace-common", "httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_workspace_evaluations"]
exclude = ["/datasets"]

[tool.hatch.build.targets.sdist]
only-include = ["src/mcp_workspace_evaluations", "pyproject.toml"]

[tool.uv.sources]
mcp-workspace-common = { workspace = true }
