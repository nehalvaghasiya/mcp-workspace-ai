{
  "version": 1,
  "disable_existing_loggers": false,
  "handlers": {
    "console": {
      "class": "logging.StreamHandler",
      "stream": "ext://sys.stderr"
    }
  },
  "loggers": {
    "workspace.tools": {
      "handlers": [
        "console"
      ],
      "level": "INFO",
      "propagate": false
    },
    "httpx": {
      "level": "WARNING"
    },
    "httpx2": {
      "level": "WARNING"
    }
  }
}
