[project]
name = "mcp-workspace-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp-workspace-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "mcp-servers/*", "packages/mcp-common", "evaluations"]

[tool.uv.sources]
mcp-workspace-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "respx>=0.22", "ruff>=0.11", "mypy>=1.15", "pip-audit>=2.8", "bandit>=1.8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "apps/api/tests", "mcp-servers", "packages/mcp-common/tests"]

