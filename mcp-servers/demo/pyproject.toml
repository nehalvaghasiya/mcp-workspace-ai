[project]
name = "mcp-workspace-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ['mcp-workspace-common']

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_demo"]

[tool.uv.sources]
mcp-workspace-common = { workspace = true }
