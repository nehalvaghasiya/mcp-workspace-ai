[project]
name = "mcp-workspace-documents"
version = "0.1.0"
description = "Validated local document generation and artifact MCP tools"
requires-python = ">=3.12"
dependencies = [
  "mcp-workspace-common",
  "mcp[cli]>=2.3.0,<3",
  "pydantic>=2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "reportlab>=4.3",
  "pypdf>=5",
  "defusedxml>=0.7",
]

[tool.uv.sources]
mcp-workspace-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_documents"]
