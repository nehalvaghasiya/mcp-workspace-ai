[project]
name = "mcp-workspace-drive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ['mcp-workspace-common', 'openpyxl>=3.1', 'python-pptx>=1.0', 'reportlab>=4.3']

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_drive"]

[tool.uv.sources]
mcp-workspace-common = { workspace = true }
